<body>

<h1>Рекомендації по вибору місця лову</h1>
<p>Аналіз погодних умов для риболовлі</p>


<form id="fishing-form">

    <label>
        Місто:
        <input type="text" id="city" placeholder="Введіть місто">
    </label>

    <br><br>

    <label>
        Широта:
        <input type="number" id="latitude" placeholder="Або назву міста, або широту.">
    </label>

    <br><br>

    <label>
        Довгота:
        <input type="number" id="longitude" placeholder="Або назву міста, або довготу.">
    </label>

    <br><br>

    <label>
        Дата рибалки:
        <input type="date" id="fishingDate" placeholder="Дата майбутньої рибалки.">
    </label>

    <br><br>

    <button type="submit">Проаналізувати</button>

</form>

<h2>Результат аналізу :</h2>

<div id="result">
    <div id="main-screen">
        <div id="main-cards"></div>
    </div>

    <div id="detail-screen" hidden>
        <button id="back-button" type="button">
            ← На головний екран
        </button>

        <div id="detail-content"></div>
    </div>

    <div id="text-screen" hidden>
        <button id="text-back-button" type="button">
            ← На головний екран
        </button>

        <div id="text-content"></div>
    </div>
</div>

<script>


    function createSeasonCard(item, resultElement) {
        const block = document.createElement("div");
        block.className = "season-card";
        const seasonText = item.toLowerCase();

        if (seasonText.includes("пізньої осені") ||
            seasonText.includes("восени") ||
            seasonText.includes("ранньою осінню")) {
            block.classList.add("season-autumn");
        } else if (seasonText.includes("влітку")) {
            block.classList.add("season-summer");
        } else if (seasonText.includes("весною") ||
                   seasonText.includes("навесні")) {
            block.classList.add("season-spring");
        }
        const parts = item.split(":");
        const heading = document.createElement("h3");
        heading.textContent = parts[0] + ":";

        const text = document.createElement("p");
        text.textContent = parts.slice(1).join(":").trim();
        block.appendChild(heading);
        block.appendChild(text);

        resultElement.appendChild(block);
    }
    function getRecommendationCategory(index) {
        if (index === 1) {
            return "pressure";
        } else if (index === 2) {
            return "temperature";
        } else if (index === 3) {
            return "wind";
        } else if (index === 4) {
            return "precipitation";
        } else {
            return "other";
        }
    }
    function appendRecommendationParagraphs(item, card) {
        const sentences = item.split(/(?<!\d)\.\s+/);

        sentences.forEach(sentence => {
            const paragraph = document.createElement("p");
            paragraph.textContent = sentence.trim();
            card.appendChild(paragraph);
        });
    }
    function createRecommendationCards() {
        const sections = {
            pressure: "Атмосферний тиск",
            temperature: "Температура води",
            wind: "Вітер",
            precipitation: "Опади",
            other: "Інші рекомендації"
        };

        const cards = {};

        for (const key in sections) {
            const card = document.createElement("div");
            card.className = "analysis-section";

            const heading = document.createElement("h3");
            heading.textContent = sections[key];

            card.appendChild(heading);
            cards[key] = card;
        }
       return { sections, cards };
    }
    function renderRecommendations(recommendations, resultElement, cards) {
        recommendations.forEach((item, index) => {
            if (index === 0) {
                createSeasonCard(item, resultElement);
            } else {
                const category = getRecommendationCategory(index);
                appendRecommendationParagraphs(item, cards[category]);
            }
        });
    }
    function renderCompasses(windData, resultElement) {
        const allCompassContainer = createCompassContainer(windData);
        resultElement.appendChild(allCompassContainer);

        const strongWindContainer = createStrongWindContainer(
            windData.farStrongWindDirection,
            windData.nearStrongWindDirection
        );

        if (strongWindContainer) {
            resultElement.appendChild(strongWindContainer);
        }

        return allCompassContainer;
    }
    function renderRecommendationCards(sections, cards, resultElement) {
        for (const key in sections) {
            if (cards[key].children.length > 1) {
                resultElement.appendChild(cards[key]);
            }
        }
    }
    function createFishingRequest() {
        return {
            latitude: Number(document.getElementById("latitude").value),
            longitude: Number(document.getElementById("longitude").value),
            city: document.getElementById("city").value,
            fishingDate: document.getElementById("fishingDate").value
        };
    }
    async function sendFishingRequest(request) {
        const response = await fetch("https://bite-shore.onrender.com/api/fishing/analyze", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(request)
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || "Помилка запиту");
        }

        return data;
    }
    function displayFishingResults(data, resultElement) {
        resultElement.querySelector("#main-cards").innerHTML = "";
        resultElement.querySelector("#detail-content").innerHTML = "";
        resultElement.querySelector("#text-content").innerHTML = "";

        const mainCards = resultElement.querySelector("#main-cards");
        const detailContent = resultElement.querySelector("#detail-content");
        const textContent = resultElement.querySelector("#text-content");

        const { sections, cards } = createRecommendationCards();

        renderRecommendations(data.recommendation, textContent, cards);
        const windText = data.recommendation[3];
        const windData = parseWindData(windText);

        const windPreviewCard = createWindPreviewCard(windData);
        mainCards.appendChild(windPreviewCard);

        const allCompassContainer = renderCompasses(
            windData,
            document.createElement("div")
        );

        highlightCompassDirections(allCompassContainer);
        setWindCompassAngles(allCompassContainer);

        windPreviewCard.addEventListener("click", () => {
            showCardDetails(allCompassContainer);
        });
        const pressureText = data.recommendation[1];
        const pressureData = parsePressureData(pressureText);

        const pressureCard = createPressurePreviewCard();
        mainCards.appendChild(pressureCard);

        pressureCard.addEventListener("click", () => {
           const pressureDetails = createPressureCard(pressureData);
           showCardDetails(pressureDetails);
        });
        const temperatureText = data.recommendation[2];
        const temperatureData = parseTemperatureData(temperatureText);

        console.log("Текст про температуру:", temperatureText);
        console.log("Розібрані дані температури:", temperatureData);

        const temperatureCard = createTemperaturePreviewCard();
        mainCards.appendChild(temperatureCard);

        temperatureCard.addEventListener("click", () => {
            const temperatureDetails = createTemperatureCard(temperatureData);
            showCardDetails(temperatureDetails);
        });
        const precipitationText = data.recommendation[4];
        const precipitationData = parsePrecipitationData(precipitationText);

        console.log("Текст про опади:", precipitationText);
        console.log("Розібрані дані опадів:", precipitationData);

        const precipitationCard = createPrecipitationPreviewCard();
        mainCards.appendChild(precipitationCard);

        precipitationCard.addEventListener("click", () => {
            const precipitationDetails =
                createPrecipitationCard(precipitationData);

            showCardDetails(precipitationDetails);
        });
        const textPreviewCard = document.createElement("div");
        textPreviewCard.className = "text-preview-card";
        textPreviewCard.textContent = "Текстовий варіант";

        mainCards.appendChild(textPreviewCard);
        textPreviewCard.addEventListener("click", showTextDetails);
        renderRecommendationCards(sections, cards, textContent);
    }
    function showWindDetails() {
        const mainScreen = document.getElementById("main-screen");
        const textScreen = document.getElementById("text-screen");
        const detailScreen = document.getElementById("detail-screen");

        mainScreen.hidden = true;
        textScreen.hidden = true;
        detailScreen.hidden = false;
    }
    function showTextDetails() {
        document.getElementById("main-screen").hidden = true;
        document.getElementById("detail-screen").hidden = true;
        document.getElementById("text-screen").hidden = false;
    }
    function showDetailScreen() {
        document.getElementById("main-screen").hidden = true;
        document.getElementById("text-screen").hidden = true;
        document.getElementById("detail-screen").hidden = false;
    }
    function showMainScreen() {
        document.getElementById("detail-screen").hidden = true;
        document.getElementById("text-screen").hidden = true;
        document.getElementById("main-screen").hidden = false;
    }
    function showCardDetails(cardContent) {
        const detailContent = document.getElementById("detail-content");

        detailContent.innerHTML = "";
        detailContent.appendChild(cardContent);

        showDetailScreen();
    }
    document.getElementById("back-button").addEventListener("click", showMainScreen);
    document.getElementById("text-back-button").addEventListener("click", showMainScreen);

    document.getElementById("fishing-form").addEventListener("submit", async function (event) {

       event.preventDefault();

       const request = createFishingRequest();
       const resultElement = document.getElementById("result");



console.log("resultElement:", resultElement);
console.log("main-cards:", resultElement.querySelector("#main-cards"));


       resultElement.querySelector("#main-cards").innerHTML = "Аналізую...";

       try {
           const data = await sendFishingRequest(request);
           displayFishingResults(data, resultElement);

       } catch (error) {
           console.error(error);
           resultElement.textContent =
               "Помилка: " + error.message;
       }
   });
</script>
