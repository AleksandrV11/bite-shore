services:
  app:
    build: .
    container_name: bite-shore
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bite_short
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1"
      API_KEY: ${API_KEY}

  db:
    image: postgres:17
    container_name: bite-shore-db
    environment:
      POSTGRES_DB: bite_short
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: